name: BudMeter
options:
  deploymentTarget:
    macOS: "14.0"
packages:
  BudMeterCore:
    path: Core
targets:
  BudMeter:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: BudMeterCore
      - sdk: IOBluetooth.framework
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: BudMeter
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSBluetoothAlwaysUsageDescription: BudMeter reads the battery level of your connected earbuds to track how their battery wears over time.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.budmeter.BudMeter
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
